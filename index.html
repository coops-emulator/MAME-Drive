<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MAME Drive</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c10">
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;background:#0b0c10;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;}
  #app{position:fixed;inset:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none!important;}
  input[type=file]{display:none;}

  #library-view{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  #toolbar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#111318;flex-wrap:wrap;}
  #toolbar h1{font-size:1.05rem;margin:0;margin-right:auto;}
  #toolbar button{background:#1c1f26;color:#eee;border:1px solid #2a2d35;border-radius:8px;padding:9px 14px;font-size:.85rem;}
  #toolbar button.primary{background:#4da3ff;color:#04121f;border:none;font-weight:600;}
  #biosSelect{background:#181a20;color:#eee;border:1px solid #2a2d35;padding:9px 10px;border-radius:8px;font-size:.8rem;max-width:150px;}
  #grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-auto-rows:min-content;align-content:start;gap:14px;}
  .empty{grid-column:1/-1;text-align:center;color:#777;padding:60px 20px;font-size:.9rem;}
  .card{background:#15171d;border-radius:10px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .card .art{aspect-ratio:3/4;background:#1c1f26;display:flex;align-items:center;justify-content:center;color:#444;font-size:.7rem;text-align:center;padding:6px;overflow:hidden;}
  .card .art img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .info{padding:8px;}
  .card .name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .sub{font-size:.7rem;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .play{position:absolute;inset:0;background:transparent;border:none;}
  .card .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#eee;border:none;border-radius:50%;width:24px;height:24px;font-size:.85rem;line-height:1;z-index:2;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#15171d;border-radius:14px;padding:20px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal h2{margin:0 0 12px;font-size:1.05rem;}
  .modal button{width:100%;margin-top:8px;background:#1c1f26;color:#eee;border:1px solid #2a2d35;border-radius:8px;padding:10px;}
  .bios-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #23262e;font-size:.85rem;}
  .bios-row button{width:auto;margin:0;padding:5px 9px;font-size:.75rem;}
  .modal .close{background:#4da3ff!important;color:#04121f!important;border:none!important;font-weight:600;}

  #topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#111318;gap:8px;}
  #topbar button{background:#1c1f26;color:#eee;border:1px solid #2a2d35;border-radius:8px;padding:8px 12px;font-size:.85rem;}
  #game-wrap{flex:1;position:relative;background:#000;display:none;overflow:hidden;justify-content:center;align-items:center;}
  #game-wrap.show{display:flex;}
  #game{width:100%;height:100%;display:flex;justify-content:center;align-items:center;}

  #loading-overlay{position:fixed;inset:0;background:#0b0c10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;}
  #loading-overlay.show{display:flex;}
  .spinner{width:44px;height:44px;border:4px solid #23262e;border-top-color:#4da3ff;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading-overlay p{color:#aaa;font-size:.9rem;margin:0;text-align:center;padding:0 20px;}
  #loading-overlay button{margin-top:10px;background:#1c1f26;color:#eee;border:1px solid #2a2d35;border-radius:8px;padding:8px 16px;font-size:.8rem;}
</style>
</head>
<body>
<div id="app">

  <div id="library-view">
    <div id="toolbar">
      <h1>MAME Drive</h1>
      <select id="biosSelect"><option value="">BIOS: none</option></select>
      <select id="coreSelect">
        <option value="fbneo">Core: FinalBurn Neo</option>
        <option value="mame2003_plus">Core: MAME 2003-Plus</option>
      </select>
      <button id="manageBiosBtn">BIOS</button>
      <button id="addBtn" class="primary">+ Add ROM</button>
    </div>
    <div id="grid"><div class="empty">No ROMs yet. Tap "+ Add ROM" to load a MAME romset .zip.<br>Only load ROMs you're legally entitled to use.</div></div>
  </div>

  <div id="topbar" class="hidden">
    <strong id="title" style="font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></strong>
    <div style="display:flex;gap:8px;">
      <button id="switchCoreBtn"></button>
      <button id="fsBtn">Fullscreen</button>
      <button id="backBtn">Library</button>
    </div>
  </div>
  <div id="game-wrap"><div id="game"></div></div>

  <input type="file" id="romInput" accept=".zip" multiple>
  <input type="file" id="biosInput" accept=".zip">
  <input type="file" id="biosBundleInput" accept=".zip">
</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p id="loading-text">Loading…</p>
  <button id="cancelLoad">Cancel</button>
</div>

<div id="bios-modal-holder"></div>

<script>
/* ---------- tiny IndexedDB helper ---------- */
const DB_NAME = 'mame-player', DB_VER = 2;
// v2 splits blobs out of the metadata stores. Listing the library/BIOS used to
// pull every ROM and all ~97MB of BIOS files into memory at once, which is what
// kills iOS Safari. Now 'roms'/'bios' hold tiny records and 'romdata'/'biosdata'
// hold the blobs, read one at a time by key.
let dbPromise = null;
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const db = r.result, tx = r.transaction;
      if (!db.objectStoreNames.contains('roms')) db.createObjectStore('roms', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('bios')) db.createObjectStore('bios', { keyPath: 'name' });
      if (!db.objectStoreNames.contains('romdata')) db.createObjectStore('romdata', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('biosdata')) db.createObjectStore('biosdata', { keyPath: 'name' });
      if (e.oldVersion > 0 && e.oldVersion < 2){
        const move = (meta, data, key) => {
          const c = tx.objectStore(meta).openCursor();
          c.onsuccess = () => {
            const cur = c.result; if (!cur) return;
            const v = cur.value;
            if (v.blob){
              tx.objectStore(data).put({ [key]: v[key], blob: v.blob });
              const rest = Object.assign({}, v); delete rest.blob; cur.update(rest);
            }
            cur.continue();
          };
        };
        move('roms','romdata','id'); move('bios','biosdata','name');
      }
    };
    r.onsuccess = () => { r.result.onversionchange = () => { r.result.close(); dbPromise = null; }; res(r.result); };
    r.onerror = () => { dbPromise = null; rej(r.error); };
  });
  return dbPromise;
}
async function idbGet(store, key){ const db = await openDB(); return new Promise((res,rej)=>{ const req=db.transaction(store,'readonly').objectStore(store).get(key); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
async function idbPut(store, val){ const db = await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(val); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbPutAll(store, vals){ const db = await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); const os=tx.objectStore(store); vals.forEach(v=>os.put(v)); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbAll(store){ const db = await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readonly'); const req=tx.objectStore(store).getAll(); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
async function idbDel(store, key){ const db = await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

/* ---------- elements ---------- */
const grid = document.getElementById('grid');
const addBtn = document.getElementById('addBtn');
const romInput = document.getElementById('romInput');
const biosInput = document.getElementById('biosInput');
const biosBundleInput = document.getElementById('biosBundleInput');
const biosSelect = document.getElementById('biosSelect');
const coreSelect = document.getElementById('coreSelect');
const manageBiosBtn = document.getElementById('manageBiosBtn');
const biosModalHolder = document.getElementById('bios-modal-holder');
const libraryView = document.getElementById('library-view');
const topbar = document.getElementById('topbar');
const gameWrap = document.getElementById('game-wrap');
const titleEl = document.getElementById('title');
const overlay = document.getElementById('loading-overlay');
const loadingText = document.getElementById('loading-text');
const cancelLoad = document.getElementById('cancelLoad');

let objectUrls = [];
function trackUrl(u){ objectUrls.push(u); return u; }
function revokeUrls(){ objectUrls.forEach(u=>URL.revokeObjectURL(u)); objectUrls = []; }

/* ---------- library rendering ---------- */
async function renderLibrary(){
  const roms = await idbAll('roms');
  grid.innerHTML = '';
  if (!roms.length){
    grid.innerHTML = '<div class="empty">No ROMs yet. Tap "+ Add ROM" to load a MAME romset .zip.<br>Only load ROMs you\'re legally entitled to use.</div>';
    return;
  }
  roms.sort((a,b)=> (b.addedAt||0)-(a.addedAt||0));
  roms.forEach(r => grid.appendChild(buildCard(r)));
}

function buildCard(r){
  const card = document.createElement('div');
  card.className = 'card';
  const art = document.createElement('div');
  art.className = 'art';
  if (r.meta && r.meta.image){ const img=document.createElement('img'); img.src='/api/mame-art?name='+encodeURIComponent(r.id); img.onerror=()=>{ img.remove(); art.textContent=r.id; }; img.loading='lazy'; img.decoding='async'; img.alt=''; art.appendChild(img); }
  else art.textContent = r.meta === null ? 'loading art…' : (r.id);
  const info = document.createElement('div');
  info.className = 'info';
  info.innerHTML = `<div class="name">${escapeHtml((r.meta && r.meta.title) || r.id)}</div>
                     <div class="sub">${escapeHtml(r.meta ? [r.meta.manufacturer, r.meta.year].filter(Boolean).join(' • ') : '')}</div>`;
  const play = document.createElement('button');
  play.className = 'play';
  play.title = 'Play';
  play.onclick = () => launch(r);
  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '×';
  del.onclick = async (e) => { e.stopPropagation(); await idbDel('roms', r.id); await idbDel('romdata', r.id); renderLibrary(); };
  card.append(art, info, play, del);

  if (r.meta === undefined || (r.meta && r.meta.failed && navigator.onLine && !metaTried.has(r.id))) fetchMeta(r.id);
  return card;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const metaTried = new Set();
async function fetchMeta(id){
  metaTried.add(id);
  const marking = await getRom(id);
  if (marking && marking.meta === undefined){ marking.meta = null; await idbPut('roms', marking); }
  let meta;
  try{
    // Same-origin route handled by _worker.js (avoids the source's missing CORS headers).
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    const resp = await fetch(`/api/mame-meta?name=${encodeURIComponent(id)}`, { signal: ctrl.signal });
    clearTimeout(t);
    meta = await resp.json();
  }catch(e){
    meta = { title:id, manufacturer:'', year:'', image:'', failed:true }; // retried next time we're online
  }
  const rec = await getRom(id);
  if (rec){ rec.meta = meta; await idbPut('roms', rec); }
  renderLibrary();
}
async function getRom(id){ return idbGet('roms', id); }

/* ---------- adding ROMs ---------- */
addBtn.onclick = () => romInput.click();
romInput.addEventListener('change', async e => {
  for (const file of e.target.files){
    const id = file.name.replace(/\.zip$/i,'').toLowerCase();
    await idbPut('romdata', { id, blob: file });
    await idbPut('roms', { id, addedAt: Date.now(), size: file.size, meta: undefined });
  }
  romInput.value = '';
  renderLibrary();
});

/* ---------- BIOS management ---------- */
async function refreshBiosSelect(){
  const list = await idbAll('bios');
  const current = localStorage.getItem('mp_default_bios') || '';
  biosSelect.innerHTML = '<option value="">BIOS: none</option>' + list.map(b => `<option value="${escapeHtml(b.name)}">${escapeHtml(b.name)}</option>`).join('');
  biosSelect.value = list.some(b=>b.name===current) ? current : '';
}
biosSelect.onchange = () => localStorage.setItem('mp_default_bios', biosSelect.value);
coreSelect.value = localStorage.getItem('mp_core') || 'fbneo';
coreSelect.onchange = () => localStorage.setItem('mp_core', coreSelect.value);

function openBiosModal(){
  idbAll('bios').then(list => {
    biosModalHolder.innerHTML = `
      <div class="modal-bg" id="biosModalBg">
        <div class="modal">
          <h2>BIOS files</h2>
          <p style="font-size:.75rem;color:#888;margin:0 0 8px;">Some systems (e.g. Neo Geo) need their BIOS zip alongside the game. Upload once, then pick it from the BIOS dropdown before playing.</p>
          <div id="biosList">${list.length ? list.map(b=>`<div class="bios-row"><span>${escapeHtml(b.name)}</span><button data-del="${escapeHtml(b.name)}">Remove</button></div>`).join('') : '<div style="font-size:.8rem;color:#666;">No BIOS files uploaded.</div>'}</div>
          <button id="addBiosBtn">+ Upload single BIOS .zip</button>
          <button id="addBiosBundleBtn">+ Upload BIOS/device bundle (.zip of many)</button>
          <div id="biosBundleProgress" style="font-size:.75rem;color:#888;margin-top:6px;"></div>
          <button class="close" id="closeBiosModal">Close</button>
        </div>
      </div>`;
    document.getElementById('addBiosBtn').onclick = () => biosInput.click();
    document.getElementById('addBiosBundleBtn').onclick = () => biosBundleInput.click();
    document.getElementById('closeBiosModal').onclick = () => biosModalHolder.innerHTML = '';
    document.getElementById('biosModalBg').addEventListener('click', e => { if (e.target.id==='biosModalBg') biosModalHolder.innerHTML=''; });
    document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => { await idbDel('bios', btn.dataset.del); await idbDel('biosdata', btn.dataset.del); await refreshBiosSelect(); openBiosModal(); });
  });
}
manageBiosBtn.onclick = openBiosModal;
biosInput.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f){ await idbPut('biosdata', { name: f.name, blob: f }); await idbPut('bios', { name: f.name }); await refreshBiosSelect(); if (biosModalHolder.innerHTML) openBiosModal(); }
  biosInput.value = '';
});

let fflateLoad = null;
function loadFflate(){
  if (window.fflate) return Promise.resolve();
  if (fflateLoad) return fflateLoad;
  fflateLoad = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
    s.onload = res; s.onerror = rej;
    document.body.appendChild(s);
  });
  return fflateLoad;
}

biosBundleInput.addEventListener('change', async e => {
  const f = e.target.files[0];
  biosBundleInput.value = '';
  if (!f) return;
  const progress = document.getElementById('biosBundleProgress');
  if (progress) progress.textContent = 'Reading bundle…';
  try{
    await loadFflate();
    const buf = new Uint8Array(await f.arrayBuffer());
    const entries = window.fflate.unzipSync(buf);
    const names = Object.keys(entries).filter(n => n.toLowerCase().endsWith('.zip'));
    if (progress) progress.textContent = `Extracted ${names.length} BIOS/device files, saving…`;
    const dataRecs = names.map(name => ({ name: name.split('/').pop(), blob: new Blob([entries[name]]) }));
    const records = dataRecs.map(d => ({ name: d.name }));
    await idbPutAll('biosdata', dataRecs);
    await idbPutAll('bios', records);
    if (progress) progress.textContent = `Done — added ${records.length} BIOS/device files.`;
    await refreshBiosSelect();
    openBiosModal();
  }catch(err){
    if (progress) progress.textContent = 'Could not read that bundle — is it a .zip of .zip files?';
  }
});

/* ---------- launching a game ---------- */
let watchdog = null;
let currentRom = null;
async function launch(rom){
  stopEmulator(); // never leave a previous game running underneath
  currentRom = rom;
  overlay.classList.add('show');
  loadingText.textContent = `Loading ${(rom.meta && rom.meta.title) || rom.id}…`;

  libraryView.classList.add('hidden');
  topbar.classList.remove('hidden');
  gameWrap.classList.add('show');
  titleEl.textContent = (rom.meta && rom.meta.title) || rom.id;
  const otherCore = coreSelect.value === 'mame2003_plus' ? 'FinalBurn Neo' : 'MAME 2003-Plus';
  document.getElementById('switchCoreBtn').textContent = `Try ${otherCore}`;

  // Pass a real File (not a blob: URL). EmulatorJS names the file it gives the
  // core after the URL's last segment, so a blob URL becomes a random UUID and
  // the arcade core can't find "chasehq.zip". A File keeps its proper name.
  const romRec = await idbGet('romdata', rom.id);
  if (!romRec){ loadingText.textContent = 'ROM data missing — remove and re-add this game.'; return; }
  const gameFile = new File([romRec.blob], rom.id + '.zip', { type: 'application/zip' });
  window.EJS_player = '#game';
  window.EJS_gameUrl = gameFile;
  window.EJS_core = coreSelect.value;
  window.EJS_gameName = rom.id;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_backgroundColor = '#000';
  window.EJS_language = 'en-US';
  window.EJS_disableAutoLang = true;
  // Keep downloaded cores for a year instead of the default few days, so they stay available offline.
  window.EJS_cacheConfig = { enabled: true, cacheMaxSizeMB: 2048, cacheMaxAgeMins: 525600 };
  // Not overriding EJS_Buttons: selectively hiding some of EmulatorJS's own
  // buttons (e.g. fullscreen:false) crashes this build's internal click
  // wiring with "Cannot read properties of null (reading 'classList')",
  // because it still expects the (now-missing) button element to exist.
  // Leaving its defaults alone avoids the crash; our own topbar already has
  // Fullscreen/Library buttons, so the duplication is cosmetic, not harmful.

  // Prefer whatever BIOS the user picked manually. If they haven't picked one,
  // auto-match against the BIOS/parent set name the Arcade Database reports
  // for this game (rom.meta.biosOf), so you don't have to guess from a list
  // of hundreds of uploaded BIOS/device files.
  window.EJS_biosUrl = '';
  const allBios = await idbAll('bios'); // names only now — cheap
  let chosenName = biosSelect.value || '';
  if (!chosenName && rom.meta && rom.meta.biosOf){
    const hit = allBios.find(b => b.name.replace(/\.zip$/i,'').toLowerCase() === rom.meta.biosOf.toLowerCase());
    if (hit) chosenName = hit.name;
  }
  const chosenBios = chosenName ? await idbGet('biosdata', chosenName) : null;
  if (chosenBios){
    window.EJS_biosUrl = new File([chosenBios.blob], chosenBios.name, { type: 'application/zip' });
    loadingText.textContent = `Loading ${(rom.meta && rom.meta.title) || rom.id}… (BIOS: ${chosenBios.name})`;
  }

  const hideOverlay = () => {
    overlay.classList.remove('show'); clearTimeout(watchdog); canvasWatcher.disconnect();
    // Some cores size their canvas to the container only on a resize event —
    // nudge it once so the game isn't stuck at zero size until fullscreen is toggled.
    setTimeout(() => window.dispatchEvent(new Event('resize')), 300);
  };
  window.EJS_onGameStart = hideOverlay;

  // Belt-and-braces: some cores don't reliably fire EJS_onGameStart, so also
  // hide the overlay as soon as the emulator's own <canvas> shows up.
  const gameEl = document.getElementById('game');
  const canvasWatcher = new MutationObserver(() => {
    const canvas = gameEl.querySelector('canvas');
    if (canvas && canvas.width > 0) hideOverlay();
  });
  canvasWatcher.observe(gameEl, { childList: true, subtree: true, attributes: true });

  const old = document.getElementById('ejs-loader');
  if (old) old.remove();
  const s = document.createElement('script');
  s.id = 'ejs-loader';
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror = () => { loadingText.textContent = 'Failed to load emulator core — check your connection.'; };
  document.body.appendChild(s);

  clearTimeout(watchdog);
  watchdog = setTimeout(() => { if (overlay.classList.contains('show')) loadingText.textContent = 'Still working — large ROMs can take longer to boot…'; }, 12000);
}

cancelLoad.onclick = () => { overlay.classList.remove('show'); teardownGame(); };

// Fully stop the running emulator. Just emptying the container leaves the core's
// main loop, audio and input handlers alive in the background, so shut it down
// properly: pause the loop, fire EmulatorJS's own "exit" event (saves, unmounts,
// aborts the wasm module), stop audio, then remove the DOM.
function stopEmulator(){
  const emu = window.EJS_emulator;
  if (emu){
    try{ emu.gameManager && emu.gameManager.toggleMainLoop(0); }catch(e){}
    try{ clearInterval(emu.saveSaveInterval); }catch(e){}
    try{
      const al = emu.Module && emu.Module.AL;
      if (al){
        Object.values(al.contexts || {}).forEach(c => { try{ c.audioCtx && c.audioCtx.close(); }catch(e){} });
        if (al.currentCtx && al.currentCtx.audioCtx){ try{ al.currentCtx.audioCtx.close(); }catch(e){} }
      }
    }catch(e){}
    try{ emu.gamepad && emu.gamepad.timeout && clearTimeout(emu.gamepad.timeout); }catch(e){}
    try{ emu.callEvent('exit'); }catch(e){}
  }
  clearTimeout(watchdog);
  document.getElementById('game').innerHTML = '';
  const old = document.getElementById('ejs-loader');
  if (old) old.remove();
  delete window.EJS_emulator;
  delete window.EJS_gameUrl; delete window.EJS_biosUrl; // let the ROM/BIOS buffers be freed
  revokeUrls();
}

function teardownGame(){
  stopEmulator();
  gameWrap.classList.remove('show');
  topbar.classList.add('hidden');
  libraryView.classList.remove('hidden');
  renderLibrary();
}
document.getElementById('backBtn').onclick = teardownGame;
document.getElementById('switchCoreBtn').onclick = () => {
  coreSelect.value = coreSelect.value === 'mame2003_plus' ? 'fbneo' : 'mame2003_plus';
  localStorage.setItem('mp_core', coreSelect.value);
  if (currentRom){ stopEmulator(); launch(currentRom); }
};

document.getElementById('fsBtn').onclick = () => {
  if (!document.fullscreenElement) gameWrap.requestFullscreen?.() || gameWrap.webkitRequestFullscreen?.();
  else document.exitFullscreen?.() || document.webkitExitFullscreen?.();
};

/* ---------- init ---------- */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
refreshBiosSelect();
renderLibrary();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
